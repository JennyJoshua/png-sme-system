name: Process ZIP inbox

# Extracts ZIPs uploaded to _inbox/ straight into the repo (repo-relative paths, no wrapper folder).
# Valid ZIP: files are extracted (same-path files overwritten, others kept) and the ZIP is deleted.
# Invalid ZIP: nothing is extracted; the ZIP moves to _failed/ with a .report.txt explaining why.
# Edit ALLOWED_TOP_DIRS below if the project gains new top-level folders.

on:
  push:
    branches: [main]
    paths:
      - "_inbox/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-inbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOWED_TOP_DIRS: "app,components,docs,handovers,lib,public,supabase,tests"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIPs from _inbox
        env:
          RESULT_FILE: ${{ runner.temp }}/zipinbox-result.txt
        run: |
          cat > "$RUNNER_TEMP/process_zip.py" <<'PYEOF'
          import os, re, sys, zipfile, shutil, time, stat

          INBOX = "_inbox"
          FAILED = "_failed"
          MAX_ZIP_BYTES = 50 * 1024 * 1024
          MAX_ENTRIES = 1000
          MAX_UNCOMPRESSED = 100 * 1024 * 1024
          MAX_PATH_LEN = 200
          SCAN_LIMIT = 5 * 1024 * 1024
          ALLOWED_TOP_DIRS = {d.strip() for d in os.environ.get("ALLOWED_TOP_DIRS", "app,components,docs,handovers,lib,public,supabase,tests").split(",") if d.strip()}
          DENIED_ANY = {".git", ".github", "node_modules", ".next"}
          DENIED_TOP = {"_inbox", "_failed"}
          NAME_OK = re.compile(r"^[A-Za-z0-9._()\[\]@+~-]+$")
          ZIP_NAME_OK = re.compile(r"^[a-z0-9-]+\.zip$")
          SECRET_NAME = [
              re.compile(r"^\.env($|\.)(?!example$)", re.I), re.compile(r"\.(pem|key|p12|pfx|jks|keystore)$", re.I),
              re.compile(r"^id_(rsa|dsa|ecdsa|ed25519)", re.I), re.compile(r"^(\.npmrc|\.netrc|\.pypirc)$", re.I),
              re.compile(r"^(credentials|service[-_]?account|secrets?)([-_.].*)?\.(json|ya?ml|txt|env)$", re.I),
          ]
          SECRET_CONTENT = [
              ("private key block", re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----")),
              ("Supabase secret key", re.compile(rb"sb_secret_[A-Za-z0-9_-]{20,}")),
              ("GitHub token", re.compile(rb"\b(ghp|gho|ghs|ghu)_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}")),
              ("AWS access key", re.compile(rb"\bAKIA[0-9A-Z]{16}\b")),
              ("API secret key", re.compile(rb"\bsk-[A-Za-z0-9_-]{24,}")),
          ]

          def validate(zpath):
              errors, plan, total = [], [], 0
              base = os.path.basename(zpath)
              if not ZIP_NAME_OK.match(base):
                  errors.append(f"ZIP filename '{base}' must use lowercase letters, numbers and hyphens only, ending .zip")
              size = os.path.getsize(zpath)
              if size > MAX_ZIP_BYTES:
                  errors.append(f"ZIP is {size} bytes; limit is {MAX_ZIP_BYTES}")
              if not zipfile.is_zipfile(zpath):
                  errors.append("File is not a valid ZIP archive")
                  return errors, plan
              try:
                  zf = zipfile.ZipFile(zpath)
              except Exception as e:
                  return errors + [f"Cannot open ZIP: {e}"], plan
              with zf:
                  infos = zf.infolist()
                  if len(infos) > MAX_ENTRIES:
                      errors.append(f"{len(infos)} entries; limit is {MAX_ENTRIES}")
                      return errors, plan
                  seen = set()
                  for info in infos:
                      name = info.filename
                      if name.endswith("/"):
                          continue
                      tag = f"'{name}'"
                      if "\\" in name or "\x00" in name or any(ord(c) < 32 for c in name):
                          errors.append(f"{tag}: backslash or control character in path"); continue
                      if name.startswith("/") or re.match(r"^[A-Za-z]:", name):
                          errors.append(f"{tag}: absolute path"); continue
                      parts = name.split("/")
                      if any(p in ("", ".", "..") for p in parts):
                          errors.append(f"{tag}: path traversal or empty path segment"); continue
                      if len(name) > MAX_PATH_LEN:
                          errors.append(f"{tag}: path longer than {MAX_PATH_LEN}"); continue
                      bad = [p for p in parts if not NAME_OK.match(p)]
                      if bad:
                          errors.append(f"{tag}: unsupported characters in '{bad[0]}'"); continue
                      lower = [p.lower() for p in parts]
                      hit = DENIED_ANY.intersection(lower)
                      if hit:
                          errors.append(f"{tag}: forbidden folder '{sorted(hit)[0]}'"); continue
                      if len(parts) > 1 and lower[0] in DENIED_TOP:
                          errors.append(f"{tag}: forbidden top-level folder '{parts[0]}'"); continue
                      if len(parts) == 1 and parts[0].lower() in (".git", ".github"):
                          errors.append(f"{tag}: forbidden"); continue
                      if len(parts) > 1 and parts[0] not in ALLOWED_TOP_DIRS:
                          errors.append(f"{tag}: top-level folder '{parts[0]}' not allowed (allowed: {', '.join(sorted(ALLOWED_TOP_DIRS))}, or files in the repo root)"); continue
                      mode = (info.external_attr >> 16) & 0xFFFF
                      ftype = stat.S_IFMT(mode)
                      if ftype == stat.S_IFLNK:
                          errors.append(f"{tag}: symlink"); continue
                      if ftype not in (0, stat.S_IFREG):
                          errors.append(f"{tag}: special file type"); continue
                      if info.flag_bits & 0x1:
                          errors.append(f"{tag}: encrypted entry"); continue
                      key = name.lower()
                      if key in seen:
                          errors.append(f"{tag}: duplicate path"); continue
                      seen.add(key)
                      if any(p.search(parts[-1]) for p in SECRET_NAME):
                          errors.append(f"{tag}: secret-like filename"); continue
                      total += info.file_size
                      if total > MAX_UNCOMPRESSED:
                          errors.append(f"Uncompressed size exceeds {MAX_UNCOMPRESSED} bytes"); return errors, plan
                      with zf.open(info) as fh:
                          data = fh.read(SCAN_LIMIT + 1)
                          if len(data) > info.file_size or (len(data) <= SCAN_LIMIT and len(data) != info.file_size):
                              errors.append(f"{tag}: size mismatch (corrupt or deceptive entry)"); continue
                      for label, rx in SECRET_CONTENT:
                          if rx.search(data[:SCAN_LIMIT]):
                              errors.append(f"{tag}: contains what looks like a {label}"); break
                      else:
                          plan.append(info)
              return errors, plan

          def target_ok(rel):
              root = os.path.realpath(".")
              cur = root
              for p in rel.split("/")[:-1]:
                  cur = os.path.join(cur, p)
                  if os.path.islink(cur):
                      return False
              t = os.path.join(root, rel)
              if os.path.islink(t) or os.path.isdir(t):
                  return False
              return os.path.realpath(os.path.dirname(t)).startswith(root)

          def extract(zpath, plan):
              written = []
              with zipfile.ZipFile(zpath) as zf:
                  for info in plan:
                      rel = info.filename
                      if not target_ok(rel):
                          raise RuntimeError(f"unsafe target path: {rel}")
                      os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
                      tmp = rel + ".zipinbox.tmp"
                      n = 0
                      with zf.open(info) as src, open(tmp, "wb") as dst:
                          while True:
                              chunk = src.read(65536)
                              if not chunk: break
                              n += len(chunk)
                              if n > info.file_size: raise RuntimeError(f"size overrun: {rel}")
                              dst.write(chunk)
                      os.replace(tmp, rel)
                      written.append(rel)
              return written

          def main():
              os.makedirs(INBOX, exist_ok=True)
              zips = sorted(f for f in os.listdir(INBOX) if f.lower().endswith(".zip") and os.path.isfile(os.path.join(INBOX, f)))
              summary = []
              if not zips:
                  print("No ZIPs in _inbox; nothing to do.")
                  return 0
              stamp = time.strftime("%Y%m%d-%H%M%S", time.gmtime())
              for z in zips:
                  zpath = os.path.join(INBOX, z)
                  try:
                      errors, plan = validate(zpath)
                      if not errors and not plan:
                          errors = ["ZIP contains no files"]
                      if not errors:
                          unsafe = [i.filename for i in plan if not target_ok(i.filename)]
                          if unsafe:
                              errors = [f"'{u}': target path is a symlink, a folder, or outside the repo" for u in unsafe]
                      if not errors:
                          try:
                              written = extract(zpath, plan)
                          except Exception as e:
                              errors, written = [f"Extraction failed: {e}"], []
                  except Exception as e:
                      errors, written = [f"Unexpected error: {e}"], []
                  if errors:
                      os.makedirs(FAILED, exist_ok=True)
                      safe = re.sub(r"[^a-z0-9-]", "-", os.path.splitext(z.lower())[0]).strip("-") or "upload"
                      dest = os.path.join(FAILED, f"{safe}.zip")
                      if os.path.exists(dest): dest = os.path.join(FAILED, f"{safe}-{stamp}.zip")
                      shutil.move(zpath, dest)
                      with open(dest[:-4] + ".report.txt", "w") as r:
                          r.write(f"ZIP rejected: {z}\nTime (UTC): {stamp}\nNothing from this ZIP was extracted.\n\nProblems:\n")
                          r.writelines(f"- {e}\n" for e in errors[:200])
                      summary.append(f"REJECTED {z}: {len(errors)} problem(s); see {dest[:-4]}.report.txt")
                      print(summary[-1])
                  else:
                      os.remove(zpath)
                      summary.append(f"EXTRACTED {z}: {len(written)} file(s)")
                      print(summary[-1])
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a") as f: f.write("\n".join(f"- {s}" for s in summary) + "\n")
              with open(os.environ.get("RESULT_FILE", ".zipinbox-result"), "w") as f:
                  f.write("; ".join(summary))
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python3 "$RUNNER_TEMP/process_zip.py"

      - name: Commit and push
        env:
          RESULT_FILE: ${{ runner.temp }}/zipinbox-result.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          MSG="chore: process ZIP inbox"
          if [ -f "$RESULT_FILE" ]; then MSG="$MSG ($(head -c 200 "$RESULT_FILE" | tr -d '\r\n"'))"; fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 5
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
